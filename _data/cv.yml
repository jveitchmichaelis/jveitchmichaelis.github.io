cv:
  name: Joshua Veitch-Michaelis
  sections:
    General Information:
      - label: Languages
        details: "English (Native), German (A1), Spanish (A2-B1)"
      - label: Pronouns
        details: He/Him
    Education:
      - institution: Mullard Space Science Laboratory, University College London
        area: Space and Climate Physics
        degree: PhD
        end_date: "2017"
        highlights:
          - "Fusion of LIDAR with stereo camera data — an assessment"
          - Supervised by Prof. Jan Peter Muller
      - institution: University of Warwick
        area: Physics
        degree: MPhys
        end_date: "2012"
        highlights:
          - First class honours
    Experience:
      - company: University of Chicago
        position: South Pole Telescope Winterover
        location: South Pole, Antarctica
        start_date: "2023"
        end_date: "2024"
        highlights:
          - "Operate and maintain the South Pole Telescope, on-site support for Event Horizon Telescope observations, critical hardware/software support."
      - company: ETH Zurich
        position: Postdoctoral Researcher in AI for remote sensing
        location: Switzerland
        start_date: "2022"
        end_date: "2023"
        highlights:
          - Joint with Restor Eco
          - "Developing machine learning algorithms for ecosystem conservation, based on remotely sensed data. Developed Restor's tree crown delineation pipeline."
      - company: Wisconsin-Madison University
        position: IceCube Winterover Experiments Operator
        location: South Pole, Antarctica
        start_date: "2020"
        end_date: "2022"
        highlights:
          - "Operate and maintain the IceCube Neutrino Observatory at the South Pole, providing critical hardware and software support (on-call 24/7 year-round)"
      - company: Liverpool John Moores University
        position: Postdoctoral Researcher in Drone Image Analysis
        start_date: "2018"
        end_date: "2020"
        highlights:
          - "Led instrument design for a real-time, drone-mounted endangered species detection system using thermal/visible imaging and deep learning."
          - "Collaborations with Save The Elephants (Kenya), WWF, ZSL (London), Durrell (Madagascar) and Knowsley Safari."
          - Development of an automatic spectral calibration pipeline for the 2m Liverpool Telescope
      - company: Frontier Development Lab (Europe)
        position: Researcher
        start_date: "2019"
        end_date: "2019"
        highlights:
          - "Worked on a team developing a flood segmentation algorithm for deployment on a satellite, supported by UNICEF and the European Space Agency (ESA). Selected from over 400 applicants."
          - "Research presented orally at Humanitarian Aid and Disaster Response workshop at NeurIPS 2019 (hadr.ai)."
          - Launched code on a D-Orbit satellite in June 2021 and it has been flight-tested in space.
      - company: I3D Robotics ltd
        position: Computer Vision/Robotics Engineer
        start_date: "2018"
        end_date: "2018"
        highlights:
          - "Designed bespoke 3D imaging systems; stereo, LIDAR, laser triangulation, high-speed image processing tools (> 400 fps)."
          - "Led a successful InnovateUK-funded project for smart agriculture; an embedded system for deep learning-based fruit detection in greenhouses."
          - "Clients included robotics, heavy industry (steel), agriculture and nuclear."
      - company: IS Instruments Ltd
        position: "STFC CASE PhD Student; Photonics Engineer"
        start_date: "2013"
        end_date: "2017"
        highlights:
          - "Led end-to-end design of a commercial IoT miniature spectrometer. Obtained UK government grant funding, PCB design and embedded firmware (Atmel AVR), optomechanical design and end-user software development."
    Honors and Awards:
      - label: "2021, 2024"
        details: "Antarctica Service Medal (Wintered Over), National Science Foundation (USA)"
      - label: "2019"
        details: "Google Cloud Research Credit LJMU ($5k) to support research into RGB-Thermal data fusion for ecology"
      - label: "2017"
        details: "Remote Sensing and Photogrammetry Society (RSPSOC) award for best PhD thesis"
      - label: "2016"
        details: "SIM Scholar, Worshipful Company of Scientific Instrument Makers. Postgraduate award for excellence in instrumentation research, nominated by UCL."
